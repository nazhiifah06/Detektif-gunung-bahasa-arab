const [c1,c2]=sky.split(',');return `<svg class="sc" viewBox="0 0 400 160" role="img"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="400" height="160" fill="url(#g${i})"/>${b}${hs(i)}</svg>`}
const HP=[[70,128],[200,138],[335,118]];
function hs(i){if(i<1||i>3)return'';return HP.map((p,j)=>got[i+'_'+j]?'':`<g class="hs" onclick="rv(${i},${j})" role="button"><circle cx="${p[0]}" cy="${p[1]}" r="15" fill="#f08a3c" stroke="#fff" stroke-width="2"/><text x="${p[0]}" y="${p[1]+6}" text-anchor="middle">🔍</text></g>`).join('')}
function dlg(){let h=`<div class="box"><h2>🗣️ Wawancara tersangka</h2><div class="chips">${SU.map((s,i)=>`<button class="${sel==i?'on':''}" onclick="sel=${i};lastD='';render(1)">${strip(s.n)==s.n?s.n:s.n}</button>`).join('')}</div>`;
if(sel!=null){h+=`<div class="chips">${QS.map((q,i)=>`<button onclick="ask(${i})">${q[0]}</button>`).join('')}</div><div class="row"><input class="inp" id="dq" dir="rtl" placeholder="أَيْنَ / رَأَيْتَ …"><button class="btn s" onclick="mic('dq')">🎤</button><button class="btn" onclick="askT()">❓</button></div><div id="dout">${lastD}</div>`}
return h+'</div>'}
function ask(i){const s=SU[sel],a=s.a[i];lastD=`<p class="who" data-o="${s.n}"></p>`+A(a[0],a[1],1);render(1)}
function askT(){const n=norm($('#dq').value);if(/(اين|مكان)/.test(n))ask(0);else if(/(رايت|ماذا|شاهد)/.test(n))ask(1);else{lastD=A("لا أَفْهَمُ. جَرِّبْ: أَيْنَ؟ أَوْ ماذا رَأَيْتَ؟","Saya tidak paham. Coba: أين؟ atau ماذا رأيت؟");render(1)}}
function base(){return `<h2>Basecamp</h2><div class="box m"><p class="who">Aturan main</p><p style="font:16px/1.6 Cairo,sans-serif;margin:0">❤️❤️❤️ Kamu punya 3 nyawa. Jawaban atau tuduhan yang salah = −1 nyawa. Tiap pos dibatasi 3 menit (mode Santai mematikan waktu). Nyawa pulih +1 di setiap pos. Jawab pertanyaan dalam bahasa Arab: ketik, pakai keyboard ⌨️, atau ucapkan 🎤.</p></div><div class="box">${A("سِتَّةُ مُتَسَلِّقِينَ يَصْعَدُونَ الجَبَل. في المَحَطَّةِ الثّانِيَةِ اِخْتَفَى هاتِفُ ماجِد. الفاعِلُ واحِدٌ مِنَ الخَمْسَة. أَنْتَ المُحَقِّق!","Enam pendaki naik gunung. Di Pos 2 HP Majid hilang. Pelakunya salah satu dari lima orang. Kamu detektifnya!",1)}</div><h2>Lima tersangka</h2>`+SU.map(s=>`<div class="box"><p class="who" data-o="${s.n}"></p>${A(s.ar,s.id,1)}</div>`).join('')+dlg()}
function post(i){const P=POS[i-1];let n=0,h=`<h2 data-o="${P.t}"></h2>`;
P.c.forEach((c,j)=>{const k=i+'_'+j;if(got[k]){n++;h+=`<div class="box${c.m?' m':''}"><p class="who"><span data-o="${c.k}"></span> – <span data-o="${c.w}"></span></p>${A(c.ar,c.id,1)}</div>`}else h+=`<button class="btn s" style="width:100%;margin:5px 0" onclick="rv(${i},${j})">🔍 Periksa petunjuk</button>`});
if(n>=2){const q=P.q;h+=`<div class="box"><p class="who">❓ Pertanyaan detektif</p>${A(q[0],q[1],1)}<div class="row"><input class="inp" id="ans" autocomplete="off" dir="rtl" placeholder="Tulis jawaban dalam bahasa Arab"><button class="btn s" onclick="mic('ans')">🎤</button><button class="btn s" onclick="kb()">⌨️</button><button class="btn" onclick="sub()">✔</button></div><div id="fb">${solved[i]?'<span class="ok">✅ Benar! Lanjut ke pos berikutnya.</span>':''}</div></div>`}
return h+dlg()}
function summit(){if(won)return `<h2>🏆 Kasus terpecahkan!</h2>`+END.map((e,i)=>`<div class="box${i?'':' m'}">${A(e[0],e[1],1)}</div>`).join('');
return `<h2>Siapa pelakunya?</h2><div class="box">${A("اِخْتَرِ المُشْتَبَهَ بِهِ الَّذِي أَخَذَ هاتِفَ ماجِد.","Pilih tersangka yang mengambil HP Majid.",1)}</div><div class="chips">${SU.map((s,i)=>`<button onclick="acc(${i})">${s.n}</button>`).join('')}</div><div id="fb">${wrong}</div>`+dlg()}
function acc(i){if(i==4){won=1}else{wrong=`<div class="box m no">${A("لَيْسَ هذا هُوَ الفاعِل. اِرْجِعْ إِلَى دَفْتَرِ المُحَقِّقِ وَحاوِلْ مَرَّةً أُخْرَى!","Bukan dia. Periksa buku detektif dan coba lagi!")}</div>`}if(i!=4)hurt();if(!dead)render(1)}
function rv(i,j){const c=POS[i-1].c[j];got[i+'_'+j]=1;beep(660);vib(40);notes.push(c);c.v.forEach(v=>vocab.set(strip(v[0]),v));render(1)}
function check(v){const n=norm(v);if(!n)return 0;const a=POS[st-1].q[2].map(norm);return a.some(x=>n==x||sim(n,x)>=.85||(n.split(' ').length<=4&&(' '+n+' ').includes(' '+x+' ')))}
function sub(){const v=$('#ans').value;if(check(v)){solved[st]=1;beep(880);vib([60,40,60]);render(1);return}
const n=hint[st]=(hint[st]||0)+1,H2=POS[st-1].q[3];hurt();tl=Math.max(5,tl-10);if(dead)return;
$('#fb').innerHTML=n<3?`<div class="no">💡 Hint ${n} (−10 detik)</div>`+A(H2[n-1][0],H2[n-1][1]):`<div class="no">${A("حاوِلْ مَرَّةً أُخْرَى! اِقْرَأِ الأَدِلَّةَ ثانِيَةً.","Coba lagi! Baca ulang petunjuknya.")}</div>`;applyH()}
function bar(){$('#steps').innerHTML=NAMES.map((n,i)=>`<span class="${i<st?'d':i==st?'c':''}">${n}</span>`).join('');$('#cnt').textContent=notes.length;document.querySelectorAll('.sk').forEach((e,i)=>e.classList.toggle('on',i==st));
const b=$('#nx');b.style.display=st==4?'none':'';b.textContent=st==0?'Mulai mendaki ▶':'Pos berikutnya ▶';b.disabled=dead||(st>0&&!solved[st]);const L=Math.max(lives,0);$('#lv').textContent='❤️'.repeat(L)+'🖤'.repeat(3-L);tmShow()}
let lives=3,tl=180,easy=false,dead=0,msg='';
function tmShow(){document.body.classList.toggle('low',!easy&&st>0&&tl<=30&&!dead);const e=$('#tm');if(e)e.textContent=easy||st==0?'':'⏱ '+Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0')}
function end(m){dead=1;msg=m;render()}
function hurt(){lives--;beep(180);vib(250);bar();if(lives<=0)end('Nyawa habis!')}
function over(){return `<div class="box m"><h2>💔 ${msg}</h2><p style="font:17px/1.6 Cairo,sans-serif">Ayo ulangi pos ini dengan 3 nyawa dan waktu penuh. Petunjuk yang sudah ditemukan tetap tersimpan.</p><button class="btn" onclick="retry()">Ulangi pos</button></div>`}
function retry(){dead=0;lives=3;tl=st==4?150:180;render()}
function save(){try{localStorage.setItem('lq1',JSON.stringify({st,got,solved,hint,notes,v:[...vocab],won,lives}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('lq1'));if(d){st=d.st;got=d.got;solved=d.solved;hint=d.hint;notes=d.notes;vocab=new Map(d.v);won=d.won;lives=d.lives==null?3:d.lives}}catch(e){}}
let ac;function beep(f){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}catch(e){}}
function vib(p){navigator.vibrate&&navigator.vibrate(p)}
let mOn=true;try{mOn=localStorage.getItem('lqm')!='0'}catch(e){}
function mus(t){const a=$('#bgm');if(t===undefined)mOn=!mOn;try{localStorage.setItem('lqm',mOn?1:0)}catch(e){}$('#bs').textContent=mOn?'🔊':'🔇';if(mOn){a.volume=.4;a.play().catch(()=>{})}else a.pause()}
document.addEventListener('visibilitychange',()=>{const a=$('#bgm');if(document.hidden)a.pause();else if(mOn&&st>0)a.play().catch(()=>{})});
document.addEventListener('click',()=>{const a=$('#bgm');if(mOn&&st>0&&a.paused)a.play().catch(()=>{})});
let stars=0;
function qz(){const e=$('#qz');if(!e)return;const V=[...vocab.values()];if(V.length<3){e.innerHTML='<p>اِفْحَصْ أَدِلَّةً أَكْثَرَ لِتَبْدَأَ التَّحَدِّي.</p>';return}
const c=V[Math.random()*V.length|0],o=[c,...V.filter(x=>x!=c).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
e.innerHTML=`<p>⭐ ${stars}</p><p class="ar" data-o="${c[0]}" style="font-size:1.4em"></p><div class="chips">${o.map(x=>`<button data-k="${x==c?1:0}">${x[1]}</button>`).join('')}</div>`;applyH();
e.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.k==1){stars++;beep(880);vib(40)}else beep(220);qz()})}
function nx(){st++;sel=null;lastD='';lives=Math.min(3,lives+1);tl=st==4?150:180;if(st==1)mus(1);render()}
function reset(){lives=3;tl=180;dead=0;st=0;got={};solved={};hint={};notes=[];vocab=new Map();sel=null;lastD='';won=0;wrong='';render()}
function render(k){const y=scrollY;$('#main').innerHTML=dead?over():scene(st)+(st==0?base():st<4?post(st):summit());applyH();bar();save();k?scrollTo(0,y):scrollTo(0,0)}
function nbo(){const e=$('#nb');e.classList.toggle('on');$('#nbc').innerHTML=`<h2>📓 Buku detektif</h2>`+(notes.length?notes.map(c=>`<div class="box"><p class="who"><span data-o="${c.k}"></span> – <span data-o="${c.w}"></span></p>${A(c.ar,c.id,1)}</div>`).join(''):'<p>لا تُوجَدُ أَدِلَّةٌ بَعْدُ.</p>')+`<h2>Kosakata</h2>`+[...vocab.values()].map(v=>`<span class="voc"><span data-o="${v[0]}"></span><small>${v[1]}</small></span>`).join('')+'<h2>🎯 تَحَدِّي الكَلِمات</h2><div id="qz"></div>';applyH();qz()}
function say(t){if(!window.speechSynthesis)return vm("المُتَصَفِّحُ لا يَدْعَمُ النُّطْق.","Browser tidak mendukung suara.");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(strip(t));u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const b=e.target.closest('.sp');if(b)say(b.dataset.t)});
document.addEventListener('focusin',e=>{if(e.target.classList.contains('inp'))focus=e.target});
function vm(a,b){$('#vs').classList.add('on');$('#vm').innerHTML=a+(b?`<br><span class="tr" style="display:block">${b}</span>`:'')}
function wave(o){$('#wv').classList.toggle('on',!!o)}
const PERM=["لَمْ يُسْمَحْ بِالمِيكْرُوفُون. اِفْتَحْ إِعْداداتِ المُتَصَفِّحِ وَاسْمَحْ بِهِ، أَوِ اكْتُبِ الإِجابَة.","Izin mikrofon ditolak. Aktifkan di pengaturan browser atau ketik jawabanmu."];
let rc=null,mr=null;
function mic(id){const el=$('#'+id);$('#au').style.display='none';
if(SR){if(rc){rc.stop();return}vm("سَنَطْلُبُ إِذْنَ المِيكْرُوفُون. تَكَلَّمْ بِالعَرَبِيَّة 🎙️","Kami akan meminta izin mikrofon. Bicaralah dalam bahasa Arab.");
rc=new SR();rc.lang='ar-SA';rc.interimResults=false;rc.onstart=()=>wave(1);
rc.onresult=e=>{const t=e.results[0][0].transcript;el.value=t;let m="يُمْكِنُكَ تَعْدِيلُ النَّصِّ قَبْلَ الإِرْسال.",d="Teks bisa kamu edit sebelum dikirim.";if(id=='ans'&&st>0&&st<4){const s=Math.round(Math.max(...POS[st-1].q[2].map(x=>sim(norm(t),norm(x))))*100);m+=` نِسْبَةُ التَّشابُه: ${s}٪`;d+=` Skor kemiripan: ${s}%`}vm(m,d)};
rc.onerror=e=>{wave(0);if(e.error=='not-allowed'||e.error=='service-not-allowed')vm(PERM[0],PERM[1]);else if(e.error=='no-speech')vm("لَمْ أَسْمَعْ شَيْئاً. حاوِلْ مَرَّةً أُخْرَى.","Tidak terdengar apa pun. Coba lagi.");else{rc=null;rec()}};
rc.onend=()=>{wave(0);rc=null};try{rc.start()}catch(e){rc=null;rec()}}else rec()}
async function rec(){if(mr&&mr.state=='recording'){mr.stop();return}
if(!navigator.mediaDevices||!window.MediaRecorder)return vm("التَّسْجِيلُ غَيْرُ مَدْعُوم. اِكْتُبِ الإِجابَة.","Perekaman tidak didukung. Ketik jawabanmu.");
try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];mr=new MediaRecorder(s);mr.ondataavailable=e=>ch.push(e.data);
mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());wave(0);const a=$('#au');a.src=URL.createObjectURL(new Blob(ch,{type:mr.mimeType}));a.style.display='block';vm("الفِحْصُ الصَّوْتِيُّ مَحْدُودٌ في هذا المُتَصَفِّح (مِثْلَ سافاري). اِسْتَمِعْ لِتَسْجِيلِكَ ثُمَّ اُكْتُبِ الإِجابَة.","Pengenalan suara terbatas di browser ini (mis. Safari iPhone). Putar ulang rekamanmu lalu ketik jawabannya.")};
mr.start();wave(1);vm("جارٍ التَّسْجِيل… اُضْغَطْ 🎤 لِلإِيقاف.","Merekam… tekan 🎤 lagi untuk berhenti.")}catch(e){wave(0);vm(PERM[0],PERM[1])}}
const KR=["ضصثقفغعهخحجد","شسيبلاتنمكط","ئءؤرىةوزظذأإ"];
function kb(){const k=$('#kb');if(!k.innerHTML)k.innerHTML=KR.map(r=>'<div>'+[...r].map(c=>`<button data-c="${c}">${c}</button>`).join('')+'</div>').join('')+'<div><button data-c=" " style="max-width:140px">␣</button><button data-c="⌫">⌫</button></div>';k.classList.toggle('on')}
$('#kb').addEventListener('mousedown',e=>e.preventDefault());
$('#kb').addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(c==null||!c&&c!==' ')return;const el=focus||$('#ans');if(!el)return;el.value=c=='⌫'?el.value.slice(0,-1):el.value+c;el.focus()});
load();tl=180;$('#bs').textContent=mOn?'🔊':'🔇';render();setInterval(()=>{if(easy||dead||st==0||won||(st<4&&solved[st])||$('#nb').classList.contains('on'))return;tl--;tmShow();if(tl<=0)end('Waktu habis!')},1000);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eaf7f1">
<title>Detektif Gunung Bahasa Arab – لُغْزُ الْجَبَلِ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Detektif Bahasa Arab – tampilan */
:root{
  --bg:#0e1621;--card:#1a2b40;--line:#2b4262;
  --paper:#f5f0e4;--paper2:#e7dfca;--ink:#1c1f24;
  --amber:#f0b84f;--red:#e5533a;--green:#45a67a;
  --mute:#9db0c4;--text:#eaf0f6;
  --r:14px;--shadow:0 10px 26px #0007;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font:500 16px/1.65 'Bricolage Grotesque',system-ui,sans-serif;
  background:radial-gradient(900px 420px at 50% -100px,#2c4668,transparent 70%),linear-gradient(#0e1621,#0a1019);
  background-attachment:fixed;
}
main{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 18px 80px}
.ar{font-family:'Amiri',serif;direction:rtl;line-height:1.9}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* Kepala halaman */
.brand{text-align:center;padding:18px 0 6px}
.brand h1{margin:0;font-size:clamp(2.8rem,12vw,4.4rem);line-height:1.25;font-weight:700;color:var(--amber);text-shadow:0 0 30px #f0b84f40}
.sub{margin:4px auto 14px;max-width:520px;color:var(--mute);font-size:.95rem}
.switch{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:.88rem}
.switch input{width:18px;height:18px;accent-color:var(--amber)}

/* HUD */
.hud{
  position:sticky;top:max(8px,env(safe-area-inset-top));z-index:5;
  display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;
  margin:16px 0 22px;padding:10px 16px;font-weight:700;font-size:.95rem;
  background:#0b1320e6;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
}
.hud .h{font-size:1.15rem;letter-spacing:3px}
.hud.hit{animation:hit .5s}
@keyframes hit{0%,100%{background:#0b1320e6}30%{background:#7a1f12}}

/* Judul bagian */
h2{display:flex;align-items:center;gap:10px;margin:30px 0 12px;font-size:1.15rem;font-weight:800}
h2::before{content:"";width:5px;height:1.2em;border-radius:3px;background:var(--amber)}
.story{padding:16px 18px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:var(--r);box-shadow:var(--shadow)}
.hint{color:var(--mute);font-size:.9rem}

/* Progres */
.bar{height:10px;margin:6px 0 4px;background:#13202f;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ffd98a);border-radius:999px;transition:width .4s}

/* Kartu petunjuk */
.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.clue{
  position:relative;padding:14px;text-align:left;border:0;border-radius:var(--r);
  background:var(--paper);color:var(--ink);box-shadow:0 4px 0 #0008,var(--shadow);
  transition:transform .15s,box-shadow .15s;
}
.clue:hover:not(:disabled){transform:translateY(-3px)}
.clue b{display:block;line-height:1.3}
.clue small{color:#6a6556}
.clue.done{background:var(--paper2)}
.clue.done::after{content:"TERBUKTI";position:absolute;right:8px;top:10px;padding:0 5px;color:var(--green);border:2px solid var(--green);border-radius:3px;font-size:.6rem;font-weight:800;transform:rotate(8deg)}
.clue.open{outline:3px solid var(--amber);outline-offset:2px}
.clue:disabled{background:#26384f;color:#7f93aa;box-shadow:none;cursor:not-allowed}
.clue:disabled small{color:#7f93aa}

/* Panel petunjuk */
.panel{counter-reset:o;margin-top:16px;padding:20px;color:var(--ink);background:var(--paper);border-top:5px solid var(--amber);border-radius:var(--r);box-shadow:var(--shadow)}
.tbar{height:10px;margin:10px 0;background:#d8d0ba;border-radius:999px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--green);border-radius:999px}
.tbar.low i{background:var(--red)}
.say{margin:12px 0;padding:12px 18px;font-size:2rem;text-align:center;background:var(--paper2);border-radius:10px;border-right:5px solid var(--amber)}
.say.h2{padding:12px 16px;font:500 .95rem/1.5 'Bricolage Grotesque',sans-serif;direction:ltr;color:#5c5748;border-right:0;border-left:5px solid #b9b19a}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.mini{padding:8px 16px;font-weight:700;background:transparent;border:2px solid var(--ink);border-radius:999px;transition:background .15s}
.mini:hover:not(:disabled){background:#e7dfca}
.mini:disabled{opacity:.4;cursor:not-allowed}
.tr{color:#4a4638;font-style:italic}

/* Pilihan jawaban */
.opt{
  display:flex;align-items:center;gap:12px;width:100%;min-height:54px;margin:8px 0;padding:10px 14px;
  text-align:left;color:var(--ink);background:#fff;border:2px solid #d3caae;border-radius:12px;
  transition:border-color .15s,transform .1s;
}
.opt::before{counter-increment:o;content:counter(o,upper-alpha);flex:none;display:grid;place-items:center;width:30px;height:30px;font-size:.85rem;font-weight:800;color:#6a6556;border:2px solid #d3caae;border-radius:50%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.ok{background:#d9efe2;border-color:var(--green)}
.opt.no{background:#f6dad3;border-color:var(--red);text-decoration:line-through;color:#7a4a40}
.ti{flex:1;min-width:0;padding:11px 14px;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:12px}
.note{margin-top:12px;padding:12px 14px;background:#fff4d6;border-left:5px solid var(--amber);border-radius:8px}

/* Tersangka */
.sus{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.s{padding:14px 12px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.s .em{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 4px;font-size:2rem;background:#0f1b2b;border-radius:50%}
.s .ar{display:block;font-size:1.7rem}
.s:not(:disabled):hover{border-color:var(--amber);transform:translateY(-3px)}
.s:disabled{cursor:not-allowed}
.s.clear{opacity:.55}.s.clear .ar{text-decoration:line-through}
.s.warn{border-color:var(--red)}
.tag{display:block;margin-top:2px;color:var(--mute);font-size:.8rem;line-height:1.4}

/* Kartu hasil, tombol, pop up */
.end{margin-top:18px;padding:22px;color:var(--ink);background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow)}
.end h3{margin:0 0 8px;font-size:1.3rem}
.go{margin-top:10px;padding:12px 24px;font-weight:800;color:#2a2008;background:var(--amber);border:0;border-radius:12px;box-shadow:0 4px 0 #b88a2c}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a2c}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:#000d;animation:fade .3s}
.box{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:520px;min-height:75vh;padding:28px 22px;text-align:center;color:var(--ink);background:var(--paper);border:4px solid var(--red);border-radius:20px;box-shadow:0 0 60px #e5533a66;animation:pop .35s}
.box.win{border-color:var(--green);box-shadow:0 0 60px #45a67a66}
.box h3{margin:4px 0;font-size:2.4rem;line-height:1.1;color:var(--red)}
.box.win h3{color:var(--green)}
.box .go{padding:14px 30px;font-size:1.1rem}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* Efek kejutan */
.scare{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;animation:flash .5s steps(1) 3}
.scare span{font-size:70vmin;line-height:1;animation:zoom 1.4s ease-in forwards,jit .08s infinite}
.scare img{width:100%;height:100%;object-fit:cover;animation:zoom 1.4s ease-in forwards,jit .08s infinite}
@keyframes zoom{from{transform:scale(.2)}to{transform:scale(1.15)}}
@keyframes jit{25%{translate:-10px 6px}75%{translate:10px -6px}}
@keyframes flash{50%{background:#a00}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@media (max-width:420px){.hud{border-radius:18px}.say{font-size:1.7rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mapw{position:relative;border-radius:16px;overflow:hidden;border-bottom:5px solid var(--or)}.mapw img{display:block;width:100%;height:auto}
.pn{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;border:3px solid #fff;background:var(--pr);color:#fff;font-weight:700;font-size:16px;padding:0;line-height:1}
.pn.lk{background:#555;opacity:.7}.pn.dn{background:#146B45}.pn.cu{background:var(--or);animation:pu 1.4s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(217,98,43,.8)}100%{box-shadow:0 0 0 20px rgba(217,98,43,0)}}
.hk{position:absolute;transform:translate(-50%,-88%);font-size:34px;transition:left 2.2s ease-in-out,top 2.2s ease-in-out,margin-left 2.2s ease-in-out;pointer-events:none;z-index:2}.hk svg{display:block;width:64px;height:92px;overflow:visible;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 3px 3px #0009)}.lg,.pl,.bd{transform-box:view-box}.lg{transform-origin:20px 33px}.pl{transform-origin:24px 18px}
.hk.wk .bd{animation:bn .3s infinite alternate}.hk.wk .lg{animation:lg .6s infinite alternate ease-in-out}.hk.wk .lg.b{animation-direction:alternate-reverse}.hk.wk .pl{animation:pl2 .6s infinite alternate ease-in-out}
@keyframes lg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}@keyframes pl2{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes bn{to{transform:translateY(-6px)}}
.cl{position:absolute;top:6%;left:-30%;width:26%;height:3%;border-radius:99px;background:rgba(255,255,255,.65);animation:cd 40s linear infinite}@keyframes cd{to{left:110%}}
.ph{position:relative;overflow:hidden;border-radius:16px;border-bottom:5px solid var(--or);aspect-ratio:3/2;margin-top:6px}
.ph .in{position:absolute;inset:0;transform-origin:60% 40%;animation:kb 18s ease-in-out infinite alternate}.ph img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes kb{to{transform:scale(1.12) translate(-2%,1%)}}
.ph .ms{position:absolute;left:-40%;top:28%;width:60%;height:18%;border-radius:50%;background:radial-gradient(closest-side,#fffa,#fff0);animation:ms 24s linear infinite}@keyframes ms{to{left:110%}}
.ph .ry{position:absolute;inset:0;background:linear-gradient(115deg,#fff0 30%,#fff5 45%,#fff0 60%);mix-blend-mode:screen;animation:ry 7s ease-in-out infinite alternate}@keyframes ry{from{opacity:.15}to{opacity:.9}}
.ph .lt{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#ffd27add,#ffd27a00 70%);transform:translate(-50%,-50%);animation:lt .9s infinite alternate}@keyframes lt{to{opacity:.35;transform:translate(-50%,-50%) scale(.8)}}
.ph .wt{position:absolute;right:0;bottom:0;width:50%;height:40%;background:repeating-linear-gradient(100deg,#fff0 0 18px,#fff4 24px,#fff0 32px);mix-blend-mode:screen;clip-path:polygon(25% 0,100% 20%,100% 100%,0 100%);animation:wt 2.4s linear infinite}@keyframes wt{to{background-position:64px 0}}
.ph .pt{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.8;animation:pt 8s linear infinite}@keyframes pt{to{transform:translateY(-130px);opacity:0}}
:root{--pr:#2E9E5B;--or:#E8832A}.pn{display:grid;place-items:center}#scr{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(#0e1621,#0a1019)}#scr[hidden]{display:none}#scr main{padding-top:12px;padding-bottom:96px}.ph{margin-bottom:6px}
body{background:#0a1a12!important}
#bgx{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bgi{position:absolute;inset:-5%;background-size:cover;background-position:center;animation:kb 26s ease-in-out infinite alternate}
.bgo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,18,12,.2),rgba(4,18,12,.62))}

.hud{background:rgba(8,24,17,.74)!important}
.story,.s{background:rgba(10,32,22,.64)!important;backdrop-filter:blur(6px)}

h2{text-shadow:0 2px 6px #000a}
.clue{border-left:6px solid var(--amber)}
#bgc span{position:absolute;opacity:.62;filter:drop-shadow(0 2px 3px #0006);animation:fl 7s ease-in-out infinite alternate}
#bgc .dx{left:0;animation:dxm 60s linear infinite}#bgc .fa{top:-6%;animation:fa 14s linear infinite}
@keyframes fl{to{transform:translateY(-16px) rotate(6deg)}}@keyframes dxm{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}@keyframes fa{to{transform:translate(40px,110vh) rotate(300deg)}}
.bgo{background:linear-gradient(180deg,rgba(4,18,12,.38),rgba(4,18,12,.52))!important}
h2{display:flex;width:fit-content;max-width:100%;padding:4px 16px 4px 12px;background:rgba(6,22,15,.62);border-radius:999px;backdrop-filter:blur(4px)}
.hint{display:inline-block;padding:2px 10px;background:rgba(6,22,15,.5);border-radius:8px}
.bgo{background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.22))!important}
.rays{position:absolute;top:-35%;right:-35%;width:100vmax;height:100vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.26) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:rot 90s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#bgt span{position:absolute;bottom:-6px;transform-origin:50% 100%;animation:sw2 3.4s ease-in-out infinite alternate;filter:drop-shadow(0 -2px 3px #0004)}
@keyframes sw2{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#bgc .dx{animation:dxm 60s linear infinite,bob 3s ease-in-out infinite alternate}@keyframes bob{to{margin-top:-14px}}
#bgc .wd{animation:wdr 12s ease-in-out infinite alternate}@keyframes wdr{33%{transform:translate(60px,-30px) rotate(8deg)}66%{transform:translate(-40px,20px) rotate(-6deg)}to{transform:translate(30px,40px)}}
#bgc .tw{animation:tw 1.6s ease-in-out infinite alternate}@keyframes tw{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}
#bgc .pu{opacity:.9;animation:pu2 4s ease-in-out infinite alternate}@keyframes pu2{to{transform:scale(1.18)}}

    return 'Login anonim belum aktif. Buka Supabase → Authentication → Sign In / Providers → aktifkan Anonymous Sign-Ins.';
  if(low.includes('invalid login credentials')) return 'Email atau password guru salah.';
  if(low.includes('email not confirmed')) return 'Email guru belum dikonfirmasi. Aktifkan/konfirmasi akun guru di Supabase Authentication.';
  if(low.includes('row-level security') || low.includes('permission denied') || low.includes('not allowed'))
    return 'Akses database ditolak. Periksa SQL dan kebijakan RLS Supabase.';
  if(low.includes('failed to fetch') || low.includes('network'))
    return 'Koneksi ke Supabase gagal. Periksa internet dan Project URL.';
  return msg;
}

async function initSupabase(){
  try{
    if(!window.supabase || typeof window.supabase.createClient !== 'function')
      throw new Error('Library Supabase tidak berhasil dimuat. Periksa koneksi internet.');
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const { data, error } = await sbClient.auth.getSession();
    if(error) throw error;
    sbReady = true;
    if(data?.session?.user){
      await restoreSupabaseSession(data.session.user);
    }else{
      login('student-login');
    }
  }catch(err){
    sbReady = false;
    sbError = authErrorText(err);
    login('student-login');
  }
}

async function getProfile(userId){
  let result = await sbClient.from('profiles').select('*').eq('id', userId).maybeSingle();
  if(result.error) throw result.error;
  if(!result.data){
    // Trigger pembuatan profil berjalan saat auth user dibuat; beri satu kesempatan retry.
    await new Promise(resolve => setTimeout(resolve, 500));
    result = await sbClient.from('profiles').select('*').eq('id', userId).maybeSingle();
    if(result.error) throw result.error;
  }
  if(!result.data) throw new Error('Profil belum terbentuk. Pastikan SQL Supabase sudah dijalankan dengan lengkap.');
  return result.data;
}

async function doAuth(){
  if(!sbReady || !sbClient){ authMessage(sbError || 'Supabase belum siap.'); return; }
  if(authBusy) return;
  authBusy = true;
  authMessage('Menghubungkan ke Supabase...');
  try{
    if(authMode === 'teacher-login'){
      const email = ($('authEmail')?.value || '').trim().toLowerCase();
      const password = $('authPassword')?.value || '';
      if(!email || !password) throw new Error('Isi email dan password guru.');
      const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
      const profile = await getProfile(data.user.id);
      if(profile.role !== 'teacher'){
        await sbClient.auth.signOut();
        throw new Error('Akun ini belum diberi role guru. Buat akun di Authentication, lalu jalankan query promosi guru pada panduan.');
      }
      currentUser = data.user; currentProfile = profile; currentRole = 'teacher'; CUR = data.user.id;
      authBusy = false;
      await teacherDashboard();
      return;
    }

    const name = ($('authName')?.value || '').trim();
    const className = ($('authClass')?.value || '').trim();
    if(name.length < 2) throw new Error('Nama siswa minimal 2 karakter.');
    if(!className) throw new Error('Isi kelas siswa terlebih dahulu.');

    const { data, error } = await sbClient.auth.signInAnonymously({
      options: { data: { full_name: name, class_name: className } }
    });
    if(error) throw error;
    const profile = await getProfile(data.user.id);
    // Pastikan nama/kelas mengikuti input terbaru pada sesi anonim ini.
    const { data: updated, error: updateError } = await sbClient.from('profiles')
      .update({ full_name: name, class_name: className })
      .eq('id', data.user.id)
      .select('*').single();
    if(updateError) throw updateError;
    currentUser = data.user; currentProfile = updated || profile; currentRole = 'student'; CUR = data.user.id;
    await loadStudentProgress();
    authBusy = false;
    pickMt();
  }catch(err){
    authBusy = false;
    authMessage(authErrorText(err));
  }
}

async function restoreSupabaseSession(user){
  try{
    currentUser = user;
    const profile = await getProfile(user.id);
    currentProfile = profile;
    currentRole = profile.role;
    CUR = user.id;
    if(currentRole === 'student'){
      await loadStudentProgress();
      pickMt();
    }else if(currentRole === 'teacher'){
      await teacherDashboard();
    }else{
      await sbClient.auth.signOut();
      currentUser = null; currentProfile = null; currentRole = null; CUR = '';
      login('student-login');
    }
  }catch(err){
    await sbClient.auth.signOut().catch(()=>{});
    currentUser = null; currentProfile = null; currentRole = null; CUR = '';
    login('student-login');
    toast('Gagal memulihkan sesi: ' + authErrorText(err));
  }
}

async function loadStudentProgress(){
  if(!currentUser || !sbClient) return;
  const { data, error } = await sbClient.from('student_progress')
    .select('mountain_id,best_score,stars,lives_left,best_at,updated_at')
    .eq('student_id', currentUser.id);
  if(error) throw error;
  const p = { n: currentProfile?.full_name || 'Siswa', c: currentProfile?.class_name || '', pr: {} };
  (data || []).forEach(row => {
    const k = Number(row.mountain_id);
    if(Number.isInteger(k) && k >= 0 && k < MT.length){
      p.pr[k] = {
        s: Number(row.best_score || 0),
        st: Number(row.stars || 0),
        l: Number(row.lives_left || 0),
        d: String(row.best_at || row.updated_at || '').slice(0,10)
      };
    }
  });
  PF = { ...PF, [currentUser.id]: p };
  CUR = currentUser.id;
  jset('lgj_pf', PF);
}

function saveRes(k,s,st,l){
  if(!currentUser || currentRole !== 'student' || !sbClient) return;
  const p = PF[CUR] || (PF[CUR] = { n: currentProfile?.full_name || 'Siswa', c: currentProfile?.class_name || '', pr: {} });
  const old = p.pr[k];
  const bestScore = !old || s > old.s ? s : old.s;
  const bestStars = Math.max(st, old ? old.st : 0);
  const date = new Date().toISOString().slice(0,10);
  p.pr[k] = { s: bestScore, st: bestStars, l, d: date };
  jset('lgj_pf', PF);

  (async()=>{
    const { error: progressError } = await sbClient.from('student_progress').upsert({
      student_id: currentUser.id,
      mountain_id: k,
      best_score: bestScore,
      stars: bestStars,
      lives_left: l,
      completed: true,
      best_at: new Date().toISOString()
    }, { onConflict: 'student_id,mountain_id' });
    if(progressError) throw progressError;
    const { error: attemptError } = await sbClient.from('game_attempts').insert({
      student_id: currentUser.id,
      mountain_id: k,
      score: s,
      stars: st,
      status: 'completed',
      result_detail: { mountain_name: MT[k].n, lives_left: l, best_score: bestScore }
    });
    if(attemptError) throw attemptError;
    toast('☁️ Progres ' + MT[k].n + ' berhasil disimpan online.');
  })().catch(err=>toast('Nilai tersimpan di sesi ini, tetapi sinkronisasi gagal: ' + authErrorText(err)));
}

async function teacherDashboard(){

    <div id="teacherContent" class="teacher-empty">Memuat data siswa...</div>`);
  try{
    const [profileResult, progressResult, attemptResult] = await Promise.all([
      sbClient.from('profiles').select('id,full_name,class_name,role,created_at').eq('role','student').order('class_name').order('full_name'),
      sbClient.from('student_progress').select('student_id,mountain_id,best_score,stars,best_at,updated_at'),
      sbClient.from('game_attempts').select('student_id,created_at').order('created_at',{ascending:false}).limit(2000)
    ]);
    if(profileResult.error) throw profileResult.error;
    if(progressResult.error) throw progressResult.error;
    if(attemptResult.error) throw attemptResult.error;
    const progressByStudent = {};
    (progressResult.data||[]).forEach(q=>{
      if(!progressByStudent[q.student_id]) progressByStudent[q.student_id]={};
      progressByStudent[q.student_id][Number(q.mountain_id)] = q;
    });
    const latestByStudent = {};
    (attemptResult.data||[]).forEach(a=>{ if(!latestByStudent[a.student_id]) latestByStudent[a.student_id]=a.created_at; });
    const rows = (profileResult.data||[]).map(u=>{
      const progress=progressByStudent[u.id]||{};
      const vals=Object.values(progress);
      return {
        uid:u.id, name:u.full_name||'Tanpa nama', className:u.class_name||'',
        progress, scores:vals.reduce((a,x)=>a+Number(x.best_score||0),0),
        stars:vals.reduce((a,x)=>a+Number(x.stars||0),0),
        completed:vals.filter(x=>x.completed).length,
        latest:latestByStudent[u.id]||vals.map(x=>x.best_at||x.updated_at||'').sort().pop()||''
      };
    });
    rows.sort((a,b)=>(a.className+a.name).localeCompare(b.className+b.name,'id'));
    teacherRows=rows;
    const content=$('teacherContent'); if(!content) return;
    const body=rows.map(r=>`<tr><td><b>${esc(r.name)}</b><br><small>${esc(r.className||'Kelas belum diisi')}</small></td>

      <td><b>${r.scores}</b><br>⭐ ${r.stars}</td><td>${r.completed}/5</td><td>${esc(r.latest?new Date(r.latest).toLocaleString('id-ID'):'—')}</td></tr>`).join('');
    content.innerHTML=rows.length?`<div class="teacher-summary">
      <div class="stat-card"><small>Jumlah siswa</small><strong>${rows.length}</strong></div>
      <div class="stat-card"><small>Gunung diselesaikan</small><strong>${rows.reduce((a,r)=>a+r.completed,0)}</strong></div>
      <div class="stat-card"><small>Total bintang</small><strong>⭐ ${rows.reduce((a,r)=>a+r.stars,0)}</strong></div>
    </div><div class="teacher-table-wrap"><table class="teacher-table"><thead><tr><th>Siswa</th>${MT.map(m=>`<th>${esc(m.n.replace('Gunung ','').toUpperCase())}</th>`).join('')}<th>Total skor</th><th>Selesai</th><th>Aktivitas terakhir</th></tr></thead><tbody>${body}</tbody></table></div>
    <p style="text-align:right"><button class="go" onclick="exportTeacherCsv()">📥 Unduh rekap CSV</button></p>`
    :'<div class="teacher-empty">Belum ada siswa yang masuk ke website.</div>';
  }catch(err){
    const content=$('teacherContent');
    if(content) content.innerHTML='<div class="auth-warning">'+esc(authErrorText(err))+' Pastikan SQL dan RLS sudah dijalankan.</div>';
  }
}
function exportTeacherCsv(){
  const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
  let csv='Nama,Kelas,'+MT.map(m=>m.n+'_Skor,'+m.n+'_Bintang').join(',')+',Total_Skor,Total_Bintang,Gunung_Selesai\n';
  teacherRows.forEach(r=>{
    const cells=[q(r.name),q(r.className)];
    MT.forEach((m,k)=>{const p=r.progress[k];cells.push(p?Number(p.best_score||0):'',p?Number(p.stars||0):'')});
    cells.push(r.scores,r.stars,r.completed);csv+=cells.join(',')+'\n';
  });
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='rekap-progres-siswa.csv';a.click();URL.revokeObjectURL(url);
}

function shuffleItems(items){
  const out=[...items];
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  return out;
}

function showVocabQuiz(){
  const pool=VOCAB_SETS[mi];
  const selected=shuffleItems(pool).slice(0,5);
  vocabQuizState={questions:selected.map(correct=>{
    const distractors=shuffleItems(pool.filter(x=>x.ar!==correct.ar)).slice(0,3);
    return {correct,options:shuffleItems([correct,...distractors])};
  }),index:0,score:0,answered:false};
  renderVocabQuiz();
  const e=$('vocabQuiz');if(e){e.hidden=false;e.scrollIntoView({behavior:'smooth',block:'center'})}
}
function renderVocabQuiz(){
  const e=$('vocabQuiz');if(!e||!vocabQuizState)return;
  const q=vocabQuizState.questions[vocabQuizState.index];
  if(!q){
    e.innerHTML=`<div class="section-kicker">LATIHAN SELESAI</div><h2>Hasil Latihan Mufradat</h2><div class="vq-question">${vocabQuizState.score} dari 5 jawaban benar</div><p class="hint">Kamu boleh mengulang materi atau melanjutkan pendakian. Latihan ini tidak mengurangi nyawa.</p><button class="go" onclick="closeVocabQuiz()">Kembali ke basecamp</button>`;
    return;
  }
  const opts=q.options.map((v,i)=>`<button class="vq-option ${vocabQuizState.answered&&v.ar===q.correct.ar?'correct':''} ${vocabQuizState.answered&&v.ar!==q.correct.ar&&vocabQuizState.chosen===i?'wrong':''}" ${vocabQuizState.answered?'disabled':''} onclick="answerVocab(${i})">${esc(v.id)}</button>`).join('');
  e.innerHTML=`<div class="section-title-row"><div><span class="section-kicker">LATIHAN MUFRADAT</span><h2>Soal ${vocabQuizState.index+1} dari 5</h2></div><span class="word-count">Benar: ${vocabQuizState.score}</span></div>
    <div class="vq-progress"><i style="width:${(vocabQuizState.index+1)/5*100}%"></i></div>
    <div class="vq-question">Apa arti kosakata berikut?</div><div class="vq-ar" lang="ar">${q.correct.ar}</div>
    <div class="vq-options">${opts}</div>
    ${vocabQuizState.answered?`<div class="vq-feedback">${vocabQuizState.chosen===q.options.findIndex(v=>v.ar===q.correct.ar)?'✓ Tepat!':'Belum tepat.'} Arti yang benar: <b>${esc(q.correct.id)}</b></div><button class="go" onclick="nextVocabQuestion()">${vocabQuizState.index===4?'Lihat hasil':'Soal berikutnya'}</button>`:''}`;
}
function answerVocab(i){
  if(!vocabQuizState||vocabQuizState.answered)return;
  const q=vocabQuizState.questions[vocabQuizState.index];
  vocabQuizState.answered=true;vocabQuizState.chosen=i;
  if(q.options[i]&&q.options[i].ar===q.correct.ar)vocabQuizState.score++;
  renderVocabQuiz();
}
function nextVocabQuestion(){
  if(!vocabQuizState)return;
  vocabQuizState.index++;vocabQuizState.answered=false;renderVocabQuiz();
}

      <button class="go" onclick="submitFinalPair()">Kunci dua bukti</button>`;
  }else{
    content=`<h3>Kesimpulan dalam Bahasa Arab</h3><p>Kasus ini terungkap karena Khalid mengaku membutuhkan uang. Tuliskan kata <b>“uang”</b> dalam Bahasa Arab.</p>
      <input class="final-input" id="finalArabic" type="text" lang="ar" dir="rtl" placeholder="اكتب هنا">
      <button class="go" onclick="submitFinalArabic()">Periksa jawaban</button>`;
  }
  $('end').innerHTML=`<div class="end"><span class="investigation-label">🧩 TANTANGAN AKHIR · ${esc(CASE_MODES[mi].name)}</span><p><b>${esc(q.q)}</b></p><div class="final-challenge">${content}</div></div>`;
  $('end').scrollIntoView({behavior:'smooth',block:'center'});
}
function chooseFinalOrder(i){
  if(finalChallengeState.includes(i))return;
  finalChallengeState.push(i);
  const sequence=$('finalSequence');
  if(sequence)sequence.innerHTML=finalChallengeState.map((n,k)=>`<span>${k+1}. ${['Kamera terakhir terlihat di atas batu dekat dapur.','Hind terlihat berada di dekat batu tersebut.','Kamera ditemukan di dalam tas hitam milik Hind.'][n]}</span>`).join('');
  const button=$('order'+i);if(button)button.classList.add('selected');
}
function submitFinalOrder(){
  if(finalChallengeState.length!==3){toast('Pilih ketiga peristiwa terlebih dahulu.');return}
  if(finalChallengeState.join(',')==='0,1,2'){levelClear();return}
  failFinalChallenge('Urutan kronologi belum tepat.');
}
function submitFinalEvidence(i){
  if(i===0){levelClear();return}
  failFinalChallenge('Bukti fisik yang dipilih belum paling kuat.');
}
function toggleFinalPair(i){
  const at=finalChallengeState.indexOf(i);
  if(at>=0)finalChallengeState.splice(at,1);
  else if(finalChallengeState.length<2)finalChallengeState.push(i);
  const b=$('pair'+i);if(b)b.classList.toggle('selected',finalChallengeState.includes(i));
  const info=$('.final-challenge p');if(info)info.textContent='Bukti dipilih: '+finalChallengeState.length+' dari 2.';
}
function submitFinalPair(){
  if(finalChallengeState.length!==2){toast('Pilih tepat dua bukti.');return}
  if([...finalChallengeState].sort().join(',')==='0,1'){levelClear();return}
  failFinalChallenge('Kombinasi bukti belum tepat.');
}
function submitFinalArabic(){
  const value=$('finalArabic')?.value||'';
  if(typeof narm==='function'&&narm(value)==='المال'){levelClear();return}
  failFinalChallenge('Kata Bahasa Arab belum tepat. Petunjuk: الْمَالَ');
}
function failFinalChallenge(message){
  finalChallengeState=[];streak=0;loseLife(message);
  if(!over)keyCard();
}
function keyAns(j){
  if(j===L().key.a){levelClear();return}
  keyFail.add(j);streak=0;loseLife('Alasan salah!');if(!over)keyCard();
}
function openClimbConfirm(){const e=$('climbConfirm');if(e)e.hidden=false}
function closeClimbConfirm(){const e=$('climbConfirm');if(e)e.hidden=true}



/* Arabic audio focus: stop background music during Istima playback,
   then resume it only if it was playing before the Arabic audio began. */
let arabicSpeechActive=false, resumeMusicAfterSpeech=false, arabicSpeechSeq=0;
function muTog(){
  if(arabicSpeechActive){toast('Musik dijeda sementara audio Bahasa Arab diputar.');return;}
  mset=1;mtog();syncMu();
}
function speak(t,pauseMusic=true){
  if(!('speechSynthesis' in window)){alert('Browser ini tidak mendukung suara. Coba Chrome atau Safari.');return;}
  const seq=++arabicSpeechSeq;
  try{speechSynthesis.cancel()}catch(e){}
  if(pauseMusic&&mus){resumeMusicAfterSpeech=true;mtog();syncMu();}
  arabicSpeechActive=true;
  const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;
  const finish=()=>{
    if(seq!==arabicSpeechSeq)return;
    arabicSpeechActive=false;
    if(resumeMusicAfterSpeech){resumeMusicAfterSpeech=false;if(!mus){mtog();syncMu();}}
  };
  u.onend=finish;u.onerror=finish;
  speechSynthesis.speak(u);
}
function play(){
  const l=L(),c=l.clues[open];
  if(c.type==='dengar'&&!solved.has(open)){
    if((plays[open]||0)>=l.plays)return;
    plays[open]=(plays[open]||0)+1;
  }
  speak(c.ar,c.type==='dengar');
  drawPanel();
}


initSupabase();

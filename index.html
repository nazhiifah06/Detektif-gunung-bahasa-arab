let au=null,auOK=null;function mtog(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();mus=!mus;clearTimeout(tm);if(!mus){au&&au.pause();return}if(!au){au=new Audio('musik.mp3');au.loop=true;au.volume=.6;au.onerror=()=>{auOK=false;if(mus){clearTimeout(tm);beat()}}}if(auOK===false)beat();else au.play().then(()=>{auOK=true}).catch(()=>{})}catch(e){mus=false}}
document.addEventListener('visibilitychange',()=>{if(mus){if(AC)document.hidden?AC.suspend():AC.resume();if(au&&auOK)document.hidden?au.pause():au.play().catch(()=>{})}});
const K='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('').concat(['ء','أ','ؤ','ئ','ى','ة']);
let S={v:'map',from:0,s:0,rev:{},hint:{},done:{},voc:[],tr:false,h:true,nb:false,talk:{},acc:null,msg:{}};
const $=s=>document.querySelector(s),A=t=>S.h?t:t.replace(H,'');
const sv=i=>{const sky=['#F6C28B','#9CC7A6','#B9C6CC','#E9885A','#FFD27A'][i];let x='';
 if(i==0)x='<polygon points="150,150 190,95 230,150" fill="#C8552B"/><polygon points="190,95 200,150 190,150" fill="#8E3A1C"/><ellipse class="fl" cx="290" cy="138" rx="9" ry="14" fill="#FF9E2C"/><ellipse class="fl" cx="290" cy="142" rx="5" ry="8" fill="#FFE27A"/>';
 if(i==1)x=[60,140,220,300,350].map((a,k)=>`<g class="sway" style="animation-delay:${k*.4}s"><rect x="${a-3}" y="115" width="6" height="35" fill="#5A3A22"/><polygon points="${a-22},120 ${a},70 ${a+22},120" fill="#14532F"/><polygon points="${a-18},100 ${a},55 ${a+18},100" fill="#1B6B3D"/></g>`).join('');
 if(i==2)x='<g fill="#fff" opacity=".6"><ellipse class="dr" cx="120" cy="105" rx="110" ry="16"/><ellipse class="dr" cx="300" cy="125" rx="120" ry="18" style="animation-duration:12s"/><ellipse class="dr" cx="200" cy="80" rx="90" ry="12" style="animation-duration:7s"/></g>';
 if(i==3)x='<circle cx="320" cy="95" r="30" fill="#FFB347"/><polygon points="40,150 80,100 130,150" fill="#5E5048"/><polygon points="110,150 160,110 210,150" fill="#756559"/><polygon points="230,150 270,118 320,150" fill="#4A3F38"/>';
 if(i==4)x='<g class="rs"><circle cx="200" cy="90" r="34" fill="#FFF3B0"/></g><g fill="#fff" opacity=".85"><ellipse class="dr" cx="90" cy="40" rx="40" ry="11"/><ellipse class="dr" cx="300" cy="55" rx="46" ry="12" style="animation-duration:12s"/></g>';
 return`<div class="sc"><svg viewBox="0 0 400 150" role="img" aria-label="مشهد"><rect width="400" height="150" fill="${sky}"/>${x}<polygon points="0,150 90,85 170,130 260,70 400,150" fill="#2F5D45" opacity="${i==3?.0:.9}"/><polygon points="0,150 60,115 140,150" fill="#1E4A36"/></svg></div>`};
const sp=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(H,''));u.lang='ar-SA';u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
const bar=()=>`<div class="bar">${S.s>0?'<button class="pill" data-a="map">🗺️ الخريطة</button>':''}<button class="pill ${S.tr?'on':''}" data-a="tr">ترجمة</button><button class="pill ${S.h?'on':''}" data-a="hk">الحركات</button><button class="pill ${mus?'on':''}" data-a="mu">${mus?'🔊':'🔇'} موسيقى</button><button class="pill" data-a="nb">📓 دفتر المحقق (${S.voc.length})</button></div>`;
const tx=(a,i)=>`<span class="ar" lang="ar">${A(a)}</span> <button class="pill" data-a="say" data-v="${a}" aria-label="استمع">🔊</button>${S.tr&&i?`<div class="tr">${i}</div>`:''}`;
function r(){let h=bar()+(S.s>0?stp():'');
 if(S.nb)h+=nbk();else if(S.s==0)h+=base();else if(S.v=='map')h+=mp();else if(S.s<5)h+=pos(S.s-1);else h+=sm();
 $('#app').innerHTML=h;window.scrollTo(0,0);if(S.v=='map'&&!S.nb&&S.s>0)anim()}
const C={map:'peta-kasus1.jpg',pts:[[46.7,88],[64.9,66.1],[44.1,52.4],[72.3,35.2],[54.2,24.7],[64.3,9.8]],sd:[-1,-1,1,-1,1,-1],nm:['القاعدة','١','٢','٣','٤','القمة']};
function mp(){const o=C.pts.map((q,i)=>`<button class="pn ${i<S.s?'dn':i==S.s?'cu':'lk'}" style="left:${q[0]}%;top:${q[1]}%" data-a="enter" ${i==S.s?'':'disabled'} aria-label="${C.nm[i]}">${i<S.s?'✓':i==0?'⛺':i==5?'🚩':C.nm[i]}</button>`).join('');
 const f=C.pts[S.from];
 return`<div class="mapw"><img src="${C.map}" alt="خريطة"><div class="cl"></div>${o}<div class="hk" id="hk" style="left:${f[0]}%;top:${f[1]}%;margin-left:${C.sd[S.from]*44}px"><svg viewBox="0 0 40 56" aria-hidden="true"><ellipse cx="21" cy="53" rx="9" ry="2" fill="#0005"/><g class="bd"><g class="lg b"><rect x="17.5" y="32" width="5" height="16" rx="2.4" fill="#2D3B55"/><rect x="16.5" y="46" width="8" height="5" rx="2" fill="#4A2E1A"/></g><rect x="7" y="14" width="11" height="19" rx="4" fill="#E8832A"/><rect x="7.5" y="10.5" width="10" height="5" rx="2.5" fill="#3B82F6"/><rect x="15" y="14" width="11" height="19" rx="4.5" fill="#1F8FD6"/><g class="lg"><rect x="17.5" y="32" width="5" height="16" rx="2.4" fill="#3A4A6B"/><rect x="16.5" y="46" width="8" height="5" rx="2" fill="#5A3A22"/></g><circle cx="22" cy="9.5" r="5.5" fill="#F2C9A0"/><path d="M15 8.5a7 6 0 0 1 14 0z" fill="#8B5E3C"/><rect x="13" y="7.5" width="18" height="2.4" rx="1.2" fill="#6B4528"/><g class="pl"><path d="M24 18L29 27" stroke="#1F6FA6" stroke-width="3.6" stroke-linecap="round"/><circle cx="29.3" cy="27.5" r="2" fill="#F2C9A0"/><rect x="28.2" y="22" width="2.2" height="30" rx="1" fill="#9AA5B1"/><rect x="27.8" y="22" width="3" height="6" rx="1.5" fill="#E5484D"/></g></g></svg></div></div><div class="row"><button class="b" data-a="enter">${S.s==5?'ادْخُلِ الْقِمَّةَ':'ادْخُلِ الْمَحَطَّةَ '+C.nm[S.s]} ←</button></div>`}
function anim(){const h=$('#hk'),t=C.pts[S.s],f=C.pts[S.from];if(!h)return;if(t!==f){h.firstChild.style.transform=t[0]<f[0]?'scaleX(-1)':'';h.classList.add('wk');setTimeout(()=>h.classList.remove('wk'),2700)}setTimeout(()=>{h.style.left=t[0]+'%';h.style.top=t[1]+'%';h.style.marginLeft=C.sd[S.s]*44+'px'},300)}

function nbk(){return`<button class="b g" data-a="nb">رجوع</button><h1>دفتر المحقق</h1><h2>المفردات</h2>`+(S.voc.length?S.voc.map(v=>`<div class="cd"><b class="ar">${A(v[0])}</b>${S.tr?` <span class="mu">— ${v[1]}</span>`:' <span class="mu">(ترجمة ← أنشط)</span>'}</div>`).join(''):'<div class="cd mu">لا توجد مفردات بعد.</div>')+'<h2>الأقوال</h2>'+Object.keys(S.talk).map(k=>{const[a,b]=k.split('_');const u=SU[a];return`<div class="cd"><b>${A(u.n)}</b><div class="ar">${A(u.a[b])}</div>${S.tr?`<div class="tr">${u.ai[b]}</div>`:''}</div>`}).join('')}
function base(){return ph('basecamp-kasus1.jpg',0)+`<div class="hd" style="--ac:#2E9E5B"><span class="nm">⛰️</span><h1>لغز الجبل</h1></div><p>${tx('سِتَّةُ أَصْدِقَاءَ صَعِدُوا الْجَبَلَ. فِي الْمَحَطَّةِ الثَّانِيَةِ اخْتَفَى هَاتِفُ سَلْمَى. السَّارِقُ وَاحِدٌ مِنَ الْخَمْسَةِ. أَنْتَ الْمُحَقِّقُ!','Enam sahabat mendaki gunung. Di Pos 2 ponsel Salma hilang. Pencurinya salah satu dari lima orang. Kamu detektifnya!')}</p><h2>الْمُشْتَبَهُ بِهِمْ</h2>`+SU.map((u,k)=>`<div class="cd sc" style="--ac:${SC[k]}"><span class="av">${EM[k]}</span><div><b style="font-size:22px">${A(u.n)}</b><div class="ar">${tx(u.d,u.i)}</div></div></div>`).join('')+`<div class="row"><button class="b" data-a="go">ابْدَأِ الصُّعُودَ ←</button></div>`}
function pos(p){const d=P[p],cl=d.c.map((c,k)=>{const key=p+'_'+k;return S.rev[key]?`<div class="cd"><b>${c.ar.startsWith('قَال')?'🗣️':'🔎'}</b> ${tx(c.ar,c.i)}</div>`:`<div class="cd lk"><button class="b g" data-a="rev" data-v="${key}">🔍 افْحَصْ دَلِيلًا</button></div>`}).join('');
 const all=d.c.every((c,k)=>S.rev[p+'_'+k]),ok=S.done[p],hn=S.hint[p]||0;
 let q='';if(all){q=`<h2>❓ سُؤَالُ الْمُحَقِّقِ</h2><div class="cd q"><b>${tx(d.q,d.qi)}</b><div class="row"><input class="t" id="inp" lang="ar" dir="rtl" placeholder="اُكْتُبْ جَوَابَكَ" ${ok?'disabled':''}></div>
 ${ok?'':`<div class="kb">${K.map(k=>`<button data-a="k" data-v="${k}">${k}</button>`).join('')}<button data-a="k" data-v=" ">␣</button><button data-a="k" data-v="⌫">⌫</button></div>
 <div class="row"><button class="b" data-a="chk">إِرْسَال</button><button class="b g" data-a="mic" id="mic">🎤 تَحَدَّثْ</button><div class="wave" id="wv"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div id="vn" class="mu"></div>`}
 ${S.msg[p]||''}${[...Array(hn)].map((_,k)=>`<div class="fb hn">💡 ${tx(d.h[k])}</div>`).join('')}</div>`}
 const people=`<h2>💬 حِوَار</h2><div class="row">`+SU.map((u,k)=>`<button class="pill" style="border-color:${SC[k]};background:${SC[k]}33" data-a="ask" data-v="${k}">${A(u.n)}</button>`).join('')+`</div><div id="dlg">${S.dl!=null?dlg(S.dl):''}</div>`;
 return`<div class="stg" style="--ac:${PC[p]}">`+(p==0?ph('pos1-kasus1.jpg',1):sv(p+1))+`<div class="hd"><span class="nm">${p+1}</span><div><h1>${A(d.t)}</h1>${S.tr?`<div class="tr">${d.ti}</div>`:''}</div></div>${cl}${q}${people}<div class="row"><button class="b" data-a="next" ${ok&&all?'':'disabled'}>${p<3?'الْمَحَطَّةُ التَّالِيَةُ ←':'إِلَى الْقِمَّةِ ←'}</button></div></div>`}
function dlg(k){const u=SU[k],f=u.m?'كُنْتَ':'كُنْتِ',rv=u.m?'رَأَيْتَ':'رَأَيْتِ';return`<div class="cd"><b>${A(u.n)}</b><div class="row"><button class="pill" data-a="say2" data-v="${k}_0">${A('أَيْنَ '+f+'؟')}</button><button class="pill" data-a="say2" data-v="${k}_1">${A('مَاذَا '+rv+'؟')}</button></div>${[0,1].filter(j=>S.talk[k+'_'+j]).map(j=>`<div class="ar">${A(u.a[j])}</div>${S.tr?`<div class="tr">${u.ai[j]}</div>`:''}`).join('')}</div>`}
function sm(){if(S.acc==='win')return sv(4)+`<h1>تَمَّ الْحَلُّ! 🎉</h1><div class="fb ok ar">${A('الْفَاعِلُ: يُوسُفُ')}</div><h2>الْقِصَّةُ كَامِلَةً</h2>`+END.map(e=>`<div class="cd">${tx(e[0],e[1])}</div>`).join('')+`<div class="row"><button class="b" data-a="again">الْعَبْ مِنْ جَدِيدٍ</button></div>`;
 return sv(4)+`<div class="hd" style="--ac:#E5484D"><span class="nm">🚩</span><h1>الْقِمَّةُ</h1></div><p>${tx('مَنِ السَّارِقُ؟ اخْتَرْ بِعِنَايَةٍ.','Siapa pencurinya? Pilih dengan hati-hati.')}</p>`+SU.map((u,k)=>`<button class="pk" style="border-right:6px solid ${SC[k]}" data-a="acc" data-v="${k}"><b>${A(u.n)}</b> <span class="mu">${u.i}</span></button>`).join('')+(S.acc!=null?`<div class="fb no">${tx('لَيْسَ هَذَا هُوَ السَّارِقُ. اقْرَأْ دَفْتَرَ الْمُحَقِّقِ وَحَاوِلْ مَرَّةً أُخْرَى.','Bukan dia pelakunya. Baca buku catatan dan coba lagi.')}</div>`:'')}
function chk(t){const p=S.s-1,d=P[p],n=nz(t);if(!n)return;if(d.ok.some(o=>n.includes(nz(o)))){S.done[p]=1;sfx(1);S.msg[p]='<div class="fb ok">✅ '+A('أَحْسَنْتَ! جَوَابٌ صَحِيحٌ.')+'</div>'}else{sfx(0);S.hint[p]=Math.min((S.hint[p]||0)+1,2);S.msg[p]='<div class="fb no">'+A('لَيْسَ صَحِيحًا. حَاوِلْ مَرَّةً أُخْرَى.')+'</div>'}r()}
let rec=null,mr=null;
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,vn=$('#vn'),wv=$('#wv');
 if(rec||mr){try{rec&&rec.stop();mr&&mr.stop()}catch(e){}return}
 const err=e=>{wv.classList.remove('on');rec=mr=null;vn.textContent=(e&&/denied|NotAllowed|not-allowed/i.test(e.error||e.name||''))?'تَمَّ رَفْضُ إِذْنِ الْمَيْكْرُوفُونِ. فعّلْه من إعدادات المتصفح أو اكتب الجواب. (Izin mikrofon ditolak: aktifkan di pengaturan browser atau ketik jawaban.)':'تعذّر التسجيل. اكتب جوابك. (Gagal merekam, silakan ketik.)'};
 vn.textContent='سنستخدم الميكروفون لسماع جوابك. (Kami memakai mikrofon untuk mendengar jawabanmu.)';
 if(SR){rec=new SR();rec.lang='ar-SA';rec.onresult=e=>{$('#inp').value=e.results[0][0].transcript;vn.textContent='✏️ يمكنك تعديل النص ثم الإرسال. (Edit teks bila perlu, lalu kirim.)'};rec.onerror=err;rec.onend=()=>{wv.classList.remove('on');rec=null};wv.classList.add('on');try{rec.start()}catch(e){err(e)}}
 else if(navigator.mediaDevices&&window.MediaRecorder){navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{const ch=[];mr=new MediaRecorder(s);mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());wv.classList.remove('on');mr=null;const u=URL.createObjectURL(new Blob(ch));vn.innerHTML='<audio controls src="'+u+'"></audio><br>⚠️ متصفحك لا يدعم التعرف على الصوت، فاكتب جوابك. (Browser ini tidak mendukung pengenalan suara; rekamanmu hanya bisa diputar ulang, jawab dengan menulis.)'};wv.classList.add('on');mr.start();vn.textContent='🔴 …'}).catch(err)}
 else vn.textContent='المتصفح لا يدعم الصوت. اكتب جوابك. (Browser tidak mendukung fitur suara.)'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='k'){const i=$('#inp');i.value=v=='⌫'?i.value.slice(0,-1):i.value+v;i.focus();return}
 if(a=='mu'){mset=1;mtog();b.classList.toggle('on',mus);b.textContent=(mus?'🔊':'🔇')+' موسيقى';return}if(a=='say'){sp(v);return}if(a=='mic'){mic();return}if(a=='chk'){chk($('#inp').value);return}
 if(a=='tr')S.tr=!S.tr;if(a=='hk')S.h=!S.h;if(a=='nb')S.nb=!S.nb;if(a=='go'){if(!mset){mset=1;mtog()}S.from=0;S.s=1;S.v='map'}
 if(a=='rev'){S.rev[v]=1;const[p,k]=v.split('_');P[p].c[k].v.forEach(w=>{if(!S.voc.some(x=>x[0]==w[0]))S.voc.push(w)})}
 if(a=='ask')S.dl=+v;if(a=='say2'){S.talk[v]=1;sp(SU[v.split('_')[0]].a[v.split('_')[1]]);}
 if(a=='next'){S.from=S.s;S.s++;S.v='map'}if(a=='enter')S.v='stage';if(a=='map'){S.nb=false;S.v='map';S.from=S.s}if(a=='acc'){S.acc=+v==3?'win':+v;sfx(+v==3)}
 if(a=='again')S={v:'map',from:0,s:0,rev:{},hint:{},done:{},voc:[],tr:S.tr,h:S.h,nb:false,talk:{},acc:null,msg:{}};
 r()});
r();
</script>
